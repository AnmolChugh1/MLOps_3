name: CI Pipeline

on:
  push:
    branches: docker-ci

jobs:
  build_and_test_container:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install the dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --force-reinstall numpy
        pip install -r requirements.txt


    - name: Run training script
      run: |
        python src/train.py

    - name: Verify model files exist
      run: |
        ls -la models/
        test -f models/Regression_model.joblib
        test -f models/test_data.joblib

    - name: Build the Docker image
      run: |
        docker build -t mlops_3:latest .

    - name: Test Docker container
      run: |
        docker run --rm mlops_3:latest python src/predict.py

    - name: Login to Docker Hub platform
      if: success()
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_NAME }}
        password: ${{ secrets.DOCKER_TOKEN }}

    - name: Push to Docker Hub
      if: success()
      run: |
        docker tag mlops_3:latest ${{ secrets.DOCKER_NAME }}/mlops_3:latest
        docker push ${{ secrets.DOCKER_NAME }}/mlops_3:latest
        echo "Docker image has been pushed successfully."